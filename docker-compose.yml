# Gassigeher SaaS Docker Compose
# Single file for all environments using profiles
#
# Usage:
#   Local dev/testing:  docker compose up -d --build
#   Production (SSL):   docker compose --profile production up -d --build
#
# Required /etc/hosts for local testing:
#   127.0.0.1 gassigeher.local demo.gassigeher.local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./data/app:/app/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gassigeher}
      POSTGRES_USER: ${DB_USER:-gassigeher}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev123}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gassigeher} -d ${DB_NAME:-gassigeher}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Production only: Caddy for wildcard SSL
  caddy:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
      - ./logs/caddy:/var/log/caddy
    environment:
      HETZNER_DNS_TOKEN: ${HETZNER_DNS_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
      - external

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
