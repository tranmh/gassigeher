# Gassigeher Docker Compose
# Supports both Simple-Mode and SaaS-Mode deployments
#
# Usage:
#   Development:      docker compose up -d --build
#   Production (SSL): docker compose --profile production up -d --build
#
# Configuration:
#   - .env         -> Application configuration (copy from .env.example)
#   - .env.secrets -> Passwords & API keys (auto-generated by install script)
#
# Resource limits designed for: 2 vCPU / 4GB RAM server

services:
  # ==================================================
  # Main Application
  # ==================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
      - .env.secrets
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./data/app:/app/data
    networks:
      - internal
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # ==================================================
  # PostgreSQL Database
  # ==================================================
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gassigeher}
      POSTGRES_USER: ${DB_USER:-gassigeher}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.secrets}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - internal
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gassigeher} -d ${DB_NAME:-gassigeher}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================================
  # MinIO S3-Compatible Object Storage
  # ==================================================
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env.secrets}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env.secrets}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - ./data/minio:/data
    networks:
      - internal
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================================
  # MinIO Bucket Initialization (runs once)
  # ==================================================
  minio-init:
    image: minio/mc:RELEASE.2024-10-02T08-27-28Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY};
      mc mb local/$${S3_BUCKET_NAME:-gassigeher-uploads} --ignore-existing;
      mc anonymous set download local/$${S3_BUCKET_NAME:-gassigeher-uploads};
      echo 'Bucket ready';
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env.secrets}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env.secrets}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-gassigeher-uploads}
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  # ==================================================
  # Prometheus - Metrics Collection
  # ==================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gassigeher-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - internal
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      app:
        condition: service_healthy

  # ==================================================
  # Grafana - Metrics Visualization
  # ==================================================
  grafana:
    image: grafana/grafana:11.2.2
    container_name: gassigeher-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env.secrets}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${BASE_URL:-http://localhost:3000}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - internal
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - prometheus

  # ==================================================
  # Caddy - Reverse Proxy with Wildcard SSL
  # (Production profile only)
  # ==================================================
  caddy:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
      - ./logs/caddy:/var/log/caddy
    environment:
      HETZNER_DNS_TOKEN: ${HETZNER_DNS_TOKEN:-}
    networks:
      - internal
      - external
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      app:
        condition: service_healthy

volumes:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
