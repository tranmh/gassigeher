# Gassigeher SaaS Docker Compose
# Single file for all environments using profiles
#
# Usage:
#   Local dev/testing:  docker compose up -d --build
#   Production (SSL):   docker compose --profile production up -d --build
#
# Required /etc/hosts for local testing:
#   127.0.0.1 gassigeher.local demo.gassigeher.local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./data/app:/app/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gassigeher}
      POSTGRES_USER: ${DB_USER:-gassigeher}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev123}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gassigeher} -d ${DB_NAME:-gassigeher}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # MinIO S3-compatible object storage (for local S3 testing)
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # MinIO bucket initialization (runs once to create bucket)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb local/$${S3_BUCKET_NAME:-gassigeher-uploads} --ignore-existing;
      mc anonymous set download local/$${S3_BUCKET_NAME:-gassigeher-uploads};
      echo 'Bucket ready';
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-gassigeher-uploads}
    networks:
      - internal

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: gassigeher-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: gassigeher-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${BASE_URL:-http://localhost:3000}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - internal
    depends_on:
      - prometheus

  # Production only: Caddy for wildcard SSL
  caddy:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
      - ./logs/caddy:/var/log/caddy
    environment:
      HETZNER_DNS_TOKEN: ${HETZNER_DNS_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
      - external

volumes:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
