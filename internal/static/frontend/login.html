<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden - Gassigeher</title>
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">🐕 Gassigeher</a>
            <nav>
                <ul>
                    <li><a href="/register.html" data-i18n="auth.register">Registrieren</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main style="padding: 60px 0;">
        <div class="container-narrow">
            <div class="card">
                <div class="card-header">
                    <h2 data-i18n="auth.login">Anmelden</h2>
                </div>

                <div id="alert-container"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label data-i18n="auth.email">E-Mail-Adresse</label>
                        <input type="email" id="email" name="email" required
                               data-i18n-placeholder="auth.email">
                        <div class="form-error" id="email-error"></div>
                    </div>

                    <div class="form-group">
                        <label data-i18n="auth.password">Passwort</label>
                        <input type="password" id="password" name="password" required
                               data-i18n-placeholder="auth.password">
                        <div class="form-error" id="password-error"></div>
                    </div>

                    <p class="text-right">
                        <a href="/forgot-password.html" data-i18n="auth.forgot_password">Passwort vergessen?</a>
                    </p>

                    <button type="submit" class="btn btn-block" id="submit-btn">
                        <span data-i18n="auth.login_button">Anmelden</span>
                    </button>
                </form>

                <p class="text-center mt-3">
                    <span data-i18n="auth.no_account">Noch kein Konto?</span>
                    <a href="/register.html" data-i18n="auth.register">Registrieren</a>
                </p>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Gassigeher. Alle Rechte vorbehalten.</p>
        </div>
    </footer>

    <script src="/js/logo-banner.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/pages/login.js"></script>
</body>
</html>
