<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" role="img" aria-label="Logo placeholder">
  <defs>
    <linearGradient id="logoBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="100" rx="8" fill="url(#logoBgGradient)"/>

  <!-- Border -->
  <rect width="400" height="100" rx="8" fill="none" stroke="#dee2e6" stroke-width="1"/>

  <!-- Dog paw icon -->
  <g transform="translate(50, 50)" fill="#82b965" opacity="0.7">
    <!-- Main pad -->
    <ellipse cx="0" cy="8" rx="12" ry="10"/>
    <!-- Toe pads -->
    <circle cx="-10" cy="-6" r="6"/>
    <circle cx="-4" cy="-12" r="5"/>
    <circle cx="4" cy="-12" r="5"/>
    <circle cx="10" cy="-6" r="6"/>
  </g>

  <!-- Placeholder text -->
  <text x="200" y="45"
        font-family="Arial, sans-serif"
        font-size="20"
        fill="#6c757d"
        text-anchor="middle"
        font-weight="600">
    Gassigeher
  </text>
  <text x="200" y="70"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="#adb5bd"
        text-anchor="middle">
    Logo hier einstellen
  </text>
</svg>
