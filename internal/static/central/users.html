<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benutzer - Central Admin</title>
    <link rel="stylesheet" href="/landing/assets/css/landing.css">
    <link rel="stylesheet" href="/central/assets/css/central.css">
</head>
<body>
    <header class="central-header">
        <div class="container">
            <a href="/central/" class="logo">Gassigeher Platform</a>
            <nav>
                <ul>
                    <li><a href="/central/">Dashboard</a></li>
                    <li><a href="/central/tenants.html">Tierheime</a></li>
                    <li><a href="/central/users.html" class="active">Benutzer</a></li>
                    <li><a href="/central/marketing.html">Marketing</a></li>
                    <li><a href="#" onclick="logout()">Abmelden</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="central-main">
        <div class="container">
            <div class="page-header">
                <h1>Benutzer suchen</h1>
                <p class="page-subtitle">Suche nach Benutzern uber alle Tierheime hinweg</p>
            </div>

            <div id="alert-container"></div>

            <!-- Search -->
            <div class="card filters-card">
                <div class="filters-row">
                    <div class="filter-group filter-group-large">
                        <input type="text" id="search-input" placeholder="Name oder E-Mail-Adresse eingeben..." class="form-input">
                    </div>
                    <button onclick="searchUsers(1)" class="btn btn-primary">Suchen</button>
                    <button onclick="clearSearch()" class="btn btn-secondary">Zurucksetzen</button>
                </div>
                <p class="filter-hint">Sucht in Vorname, Nachname und E-Mail. Leer lassen fur alle Benutzer.</p>
            </div>

            <!-- Results -->
            <div class="card">
                <div id="results-container">
                    <p class="loading">Laden...</p>
                </div>
                <div id="pagination-container"></div>
            </div>

            <!-- Central Admins Management -->
            <div class="card">
                <div class="card-header">
                    <h3>Central Administratoren verwalten</h3>
                </div>
                <div id="admins-container">
                    <p class="loading">Laden...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="/central/assets/js/central.js"></script>
    <script>
        let currentPage = 1;
        let currentQuery = '';
        const ITEMS_PER_PAGE = 25;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!isAuthenticated()) {
                window.location.href = '/login.html';
                return;
            }

            // Load all users on page load
            await searchUsers(1);
            await loadAdmins();

            // Enable search on Enter
            document.getElementById('search-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchUsers(1);
            });
        });

        function clearSearch() {
            document.getElementById('search-input').value = '';
            currentQuery = '';
            searchUsers(1);
        }

        async function searchUsers(page = 1) {
            const query = document.getElementById('search-input').value.trim();
            const container = document.getElementById('results-container');
            const paginationContainer = document.getElementById('pagination-container');

            currentPage = page;
            currentQuery = query;

            container.innerHTML = '<p class="loading">Laden...</p>';
            paginationContainer.innerHTML = '';

            try {
                const result = await centralAPI.searchUsers(query, page, ITEMS_PER_PAGE);
                const users = result.users || [];

                if (users.length === 0) {
                    container.innerHTML = '<p class="empty-state">Keine Benutzer gefunden</p>';
                    return;
                }

                container.innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>E-Mail</th>
                                <th>Tierheim</th>
                                <th>Rolle</th>
                                <th>Status</th>
                                <th>Erstellt</th>
                                <th>Aktionen</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${users.map(u => `
                                <tr>
                                    <td>${u.id}</td>
                                    <td><strong>${escapeHtml(u.first_name)} ${escapeHtml(u.last_name)}</strong></td>
                                    <td>${escapeHtml(u.email || '-')}</td>
                                    <td>
                                        ${u.tenant_name ?
                                            `<a href="/central/tenants.html?id=${u.tenant_id}">${escapeHtml(u.tenant_name)}</a>` :
                                            '<span class="text-muted">Kein Tierheim</span>'
                                        }
                                    </td>
                                    <td>
                                        ${u.is_super_admin ? '<span class="badge badge-danger">Super-Admin</span>' :
                                          u.is_central_admin ? '<span class="badge badge-info">Central-Admin</span>' :
                                          u.is_admin ? '<span class="badge badge-warning">Admin</span>' :
                                          '<span class="badge badge-secondary">Benutzer</span>'}
                                    </td>
                                    <td><span class="badge badge-${u.is_active ? 'success' : 'warning'}">${u.is_active ? 'Aktiv' : 'Inaktiv'}</span></td>
                                    <td>${formatDate(u.created_at)}</td>
                                    <td>
                                        ${!u.is_super_admin && !u.is_central_admin && u.is_active ?
                                            `<button class="btn btn-sm btn-primary" onclick="impersonateUser(${u.id}, '${escapeHtml(u.first_name)} ${escapeHtml(u.last_name)}', '${escapeHtml(u.tenant_name || '')}')">Imitieren</button>` : ''
                                        }
                                        ${!u.is_central_admin && !u.is_super_admin ?
                                            `<button class="btn btn-sm btn-secondary" onclick="promoteToAdmin(${u.id}, '${escapeHtml(u.first_name)} ${escapeHtml(u.last_name)}')">Zum Central Admin</button>` :
                                            '<span class="text-muted">Bereits Central Admin</span>'
                                        }
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <div class="table-footer">
                        <p>${result.total} Benutzer insgesamt (Seite ${result.page} von ${result.total_pages})</p>
                    </div>
                `;

                // Render pagination
                if (result.total_pages > 1) {
                    paginationContainer.innerHTML = renderPagination(result.page, result.total_pages);
                }
            } catch (err) {
                container.innerHTML = '<p class="error">Fehler bei der Suche</p>';
                showAlert('Fehler: ' + err.message, 'error');
            }
        }

        function renderPagination(currentPage, totalPages) {
            let html = '<div class="pagination">';

            // Previous button
            if (currentPage > 1) {
                html += `<button class="btn btn-sm btn-secondary" onclick="searchUsers(${currentPage - 1})">Zuruck</button>`;
            }

            // Page numbers
            const startPage = Math.max(1, currentPage - 2);
            const endPage = Math.min(totalPages, currentPage + 2);

            if (startPage > 1) {
                html += `<button class="btn btn-sm btn-secondary" onclick="searchUsers(1)">1</button>`;
                if (startPage > 2) html += '<span class="pagination-ellipsis">...</span>';
            }

            for (let i = startPage; i <= endPage; i++) {
                const activeClass = i === currentPage ? 'btn-primary' : 'btn-secondary';
                html += `<button class="btn btn-sm ${activeClass}" onclick="searchUsers(${i})">${i}</button>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += '<span class="pagination-ellipsis">...</span>';
                html += `<button class="btn btn-sm btn-secondary" onclick="searchUsers(${totalPages})">${totalPages}</button>`;
            }

            // Next button
            if (currentPage < totalPages) {
                html += `<button class="btn btn-sm btn-secondary" onclick="searchUsers(${currentPage + 1})">Weiter</button>`;
            }

            html += '</div>';
            return html;
        }

        async function loadAdmins() {
            const container = document.getElementById('admins-container');

            try {
                const admins = await centralAPI.getAdmins();

                if (admins.length === 0) {
                    container.innerHTML = '<p class="empty-state">Keine Central Admins vorhanden</p>';
                    return;
                }

                container.innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>E-Mail</th>
                                <th>Status</th>
                                <th>Erstellt</th>
                                <th>Letzte Aktivitat</th>
                                <th>Aktionen</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${admins.map(a => `
                                <tr>
                                    <td>${a.id}</td>
                                    <td><strong>${escapeHtml(a.first_name)} ${escapeHtml(a.last_name)}</strong></td>
                                    <td>${escapeHtml(a.email || '-')}</td>
                                    <td><span class="badge badge-${a.is_active ? 'success' : 'warning'}">${a.is_active ? 'Aktiv' : 'Inaktiv'}</span></td>
                                    <td>${formatDate(a.created_at)}</td>
                                    <td>${formatDate(a.last_activity_at)}</td>
                                    <td>
                                        <button class="btn btn-sm btn-warning" onclick="demoteAdmin(${a.id}, '${escapeHtml(a.first_name)} ${escapeHtml(a.last_name)}')">Entfernen</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (err) {
                container.innerHTML = '<p class="error">Fehler beim Laden</p>';
            }
        }

        async function promoteToAdmin(userId, userName) {
            if (!confirm(`${userName} zum Central Administrator befordern?`)) return;

            try {
                await centralAPI.promoteToAdmin(userId);
                showAlert(`${userName} ist jetzt Central Administrator`, 'success');
                loadAdmins();
            } catch (err) {
                showAlert('Fehler: ' + err.message, 'error');
            }
        }

        async function demoteAdmin(userId, userName) {
            if (!confirm(`Central Admin Rechte von ${userName} entfernen?`)) return;

            try {
                await centralAPI.demoteAdmin(userId);
                showAlert(`Central Admin Rechte von ${userName} entfernt`, 'success');
                loadAdmins();
            } catch (err) {
                showAlert('Fehler: ' + err.message, 'error');
            }
        }

        async function impersonateUser(userId, userName, tenantName) {
            const tenantInfo = tenantName ? ` (${tenantName})` : '';
            if (!confirm(`Als ${userName}${tenantInfo} anmelden? Sie werden zur Tierheim-Anwendung weitergeleitet.`)) return;

            try {
                const result = await centralAPI.impersonateUser(userId);

                // Store the new token
                localStorage.setItem('gassigeher_token', result.token);

                // Store info that we're impersonating (for banner display)
                localStorage.setItem('gassigeher_impersonating', JSON.stringify({
                    userName: userName,
                    tenantName: tenantName || 'Unbekannt',
                    tenantSlug: result.tenant?.slug || ''
                }));

                showAlert(`Sie sind jetzt als ${userName} angemeldet. Weiterleitung...`, 'success');

                // Redirect to tenant dashboard
                if (result.tenant?.slug) {
                    // In SaaS mode, redirect to tenant subdomain
                    const baseUrl = window.location.hostname.includes('localhost') ?
                        window.location.origin :
                        `https://${result.tenant.slug}.gassigeher.org`;
                    setTimeout(() => {
                        window.location.href = baseUrl + '/dashboard.html';
                    }, 1000);
                } else {
                    // Fallback to main domain dashboard
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);
                }
            } catch (err) {
                showAlert('Fehler beim Imitieren: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
