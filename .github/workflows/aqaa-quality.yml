# The safety net of gassigeher, written by aqaa from what its QA run found:
# unit tests with coverage and its floor, integration tests against the databases they need, end-to-end tests,
# lint, SAST and dependency audits (report only until the findings are triaged; SARIF goes to code scanning).
# Actions are pinned to commit SHAs (the comment names the release); jobs get read-only tokens.
name: aqaa quality
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks-docker:
    name: Static analysis (docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |-
          T="$(mktemp -d)"
          cd "$T"
          curl -fsSL -o hadolint "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64" && echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  hadolint" | sha256sum -c -
          sudo install -m 0755 hadolint /usr/local/bin/hadolint
          cd - > /dev/null
          rm -rf "$T"
      - name: Install dependencies
        run: mkdir -p test-reports
      - name: hadolint (lint, report only)
        run: find . -type f \( -name Dockerfile -o -name 'Dockerfile.*' -o -name '*.Dockerfile' -o -name Containerfile \) -not -path './.git/*' -not -path '*/node_modules/*' -print0 | xargs -0 -r hadolint
        continue-on-error: true
  unit-go:
    name: Unit tests (go)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install dependencies
        run: |-
          mkdir -p test-reports
          go mod download
      - name: Unit tests
        run: go run gotest.tools/gotestsum@v1.13.0 --format testname --junitfile test-reports/unit.xml -- -count=1 -covermode=atomic -coverpkg=./... -coverprofile=test-reports/coverage.out ./...
      - name: Coverage floor (30%)
        run: python3 "$GITHUB_WORKSPACE/ci/coverage_gate.py" gocover 'test-reports/coverage.out' 30
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-go
          path: test-reports
          if-no-files-found: ignore
          retention-days: 14
  integration-go:
    name: Integration tests (go)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: .
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aqaa
          POSTGRES_PASSWORD: aqaa
          POSTGRES_DB: aqaa
        ports: ['5432:5432']
        options: "--health-cmd \"pg_isready -U aqaa -d aqaa\" --health-interval 2s --health-timeout 5s --health-retries 30"
    env:
      AQAA_PG_URL: postgres://aqaa:aqaa@localhost:5432/aqaa?sslmode=disable
      AQAA_PG_CONNECTION_STRING: Host=localhost;Port=5432;Database=aqaa;Username=aqaa;Password=aqaa
      DATABASE_URL: postgres://aqaa:aqaa@localhost:5432/aqaa?sslmode=disable
      AQAA_PG_JDBC_URL: jdbc:postgresql://localhost:5432/aqaa?user=aqaa&password=aqaa
      AQAA_SQLITE_PATH: /tmp/aqaa.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install dependencies
        run: |-
          mkdir -p test-reports
          go mod download
      - name: Integration tests
        run: RUN_INTEGRATION=1 INTEGRATION=1 go run gotest.tools/gotestsum@v1.13.0 --format testname --junitfile test-reports/integration.xml -- -count=1 -tags integration -run Integration ./...
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-go
          path: test-reports
          if-no-files-found: ignore
          retention-days: 14
  checks-go:
    name: Static analysis (go)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install dependencies
        run: |-
          mkdir -p test-reports
          go mod download
      - name: go vet (lint, report only)
        run: go vet ./...
        continue-on-error: true
      - name: golangci-lint (lint, report only)
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run --output.text.path stdout --output.sarif.path test-reports/golangci.sarif ./...
        continue-on-error: true
      - if: always() && hashFiles('test-reports/golangci.sarif') != ''
        continue-on-error: true
        name: Upload golangci-lint findings to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: test-reports/golangci.sarif
          category: golangci-lint-go
      - name: govulncheck (dependency, report only)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        continue-on-error: true
  unit-node:
    name: Unit tests (node)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          mkdir -p test-reports
          npm ci
          npm install --no-save --no-audit --no-fund jest-junit@17.0.0
      - name: Unit tests
        run: JEST_JUNIT_OUTPUT_DIR=test-reports JEST_JUNIT_OUTPUT_NAME=unit.xml npx jest --ci --coverage --coverageReporters=cobertura --coverageDirectory=test-reports/coverage --reporters=default --reporters=jest-junit --testPathIgnorePatterns integration e2e
      - name: Coverage floor (98%)
        run: python3 "$GITHUB_WORKSPACE/ci/coverage_gate.py" cobertura 'test-reports/coverage/cobertura-coverage.xml' 98
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-node
          path: test-reports
          if-no-files-found: ignore
          retention-days: 14
  integration-node:
    name: Integration tests (node)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: .
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aqaa
          POSTGRES_PASSWORD: aqaa
          POSTGRES_DB: aqaa
        ports: ['5432:5432']
        options: "--health-cmd \"pg_isready -U aqaa -d aqaa\" --health-interval 2s --health-timeout 5s --health-retries 30"
    env:
      AQAA_PG_URL: postgres://aqaa:aqaa@localhost:5432/aqaa?sslmode=disable
      AQAA_PG_CONNECTION_STRING: Host=localhost;Port=5432;Database=aqaa;Username=aqaa;Password=aqaa
      DATABASE_URL: postgres://aqaa:aqaa@localhost:5432/aqaa?sslmode=disable
      AQAA_PG_JDBC_URL: jdbc:postgresql://localhost:5432/aqaa?user=aqaa&password=aqaa
      AQAA_SQLITE_PATH: /tmp/aqaa.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          mkdir -p test-reports
          npm ci
          npm install --no-save --no-audit --no-fund jest-junit@17.0.0
      - name: Integration tests
        run: JEST_JUNIT_OUTPUT_DIR=test-reports JEST_JUNIT_OUTPUT_NAME=integration.xml npx jest --ci --reporters=default --reporters=jest-junit --testPathPattern integration
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-node
          path: test-reports
          if-no-files-found: ignore
          retention-days: 14
  checks-node:
    name: Static analysis (node)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          mkdir -p test-reports
          npm ci
          npm install --no-save --no-audit --no-fund jest-junit@17.0.0
      - name: eslint (lint, report only)
        run: if ls eslint.config.* .eslintrc* >/dev/null 2>&1; then npx eslint .; else echo 'no ESLint configuration'; fi
        continue-on-error: true
      - name: npm audit (dependency, report only)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
  unit-node-e2e-tests:
    name: Unit tests (node e2e-tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: e2e-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e-tests/package-lock.json
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          mkdir -p test-reports
          npm ci
          npm install --no-save --no-audit --no-fund "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")"
      - name: Unit tests
        run: npx vitest run --coverage --coverage.reporter=cobertura --coverage.reportsDirectory=test-reports/coverage --reporter=default --reporter=junit --outputFile.junit=test-reports/unit.xml --exclude '**/*.integration.test.*' --exclude 'e2e/**'
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-node-e2e-tests
          path: e2e-tests/test-reports
          if-no-files-found: ignore
          retention-days: 14
  e2e-node-e2e-tests:
    name: End-to-end tests (node e2e-tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: e2e-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e-tests/package-lock.json
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          mkdir -p test-reports
          npm ci
          npm install --no-save --no-audit --no-fund "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")"
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-reports/e2e.xml npx playwright test --reporter=junit,list
      - if: always()
        name: Upload test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-node-e2e-tests
          path: e2e-tests/test-reports
          if-no-files-found: ignore
          retention-days: 14
  checks-node-e2e-tests:
    name: Static analysis (node e2e-tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: e2e-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e-tests/package-lock.json
      - name: Install dependencies
        run: |- # zizmor: ignore[adhoc-packages] test tooling, pinned to exact versions
          mkdir -p test-reports
          npm ci
          npm install --no-save --no-audit --no-fund "@vitest/coverage-v8@$(node -p "require('vitest/package.json').version")"
      - name: eslint (lint, report only)
        run: if ls eslint.config.* .eslintrc* >/dev/null 2>&1; then npx eslint .; else echo 'no ESLint configuration'; fi
        continue-on-error: true
      - name: npm audit (dependency, report only)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
