# docker-compose.prod.yml
# Production Docker Compose for Gassigeher SaaS
# Uses PostgreSQL + Caddy (wildcard SSL) + App

version: '3.8'

services:
  app:
    image: gassigeher:latest
    build:
      context: .
      args:
        - VERSION=${VERSION:-latest}
    restart: unless-stopped
    environment:
      # Database
      - DB_TYPE=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-24}
      # Domain
      - BASE_URL=https://gassigeher.org
      - BASE_DOMAIN=gassigeher.org
      - PORT=8080
      # S3 Storage (Hetzner Object Storage)
      - USE_S3=${USE_S3:-false}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_REGION=${S3_REGION:-fsn1}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      # SMTP
      - EMAIL_PROVIDER=smtp
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-true}
      - EMAIL_BCC_ADMIN=${EMAIL_BCC_ADMIN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount uploads volume for local storage (when USE_S3=false)
      # This persists user photos, dog photos, logos across container restarts
      - uploads_data:/app/uploads
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Share uploads volume for serving static files (when USE_S3=false)
      - uploads_data:/srv/uploads:ro
    environment:
      - HETZNER_DNS_TOKEN=${HETZNER_DNS_TOKEN}
    depends_on:
      - app
    networks:
      - internal
      - external

networks:
  internal:
    driver: bridge
  external:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uploads_data:  # Persistent storage for user uploads when USE_S3=false

# Usage Instructions:
#
# 1. Copy .env.production.example to .env and fill in values
# 2. Build and start:
#    docker-compose -f docker-compose.prod.yml up -d --build
#
# 3. View logs:
#    docker-compose -f docker-compose.prod.yml logs -f
#
# 4. Stop:
#    docker-compose -f docker-compose.prod.yml down
#
# 5. Update to new version:
#    docker-compose -f docker-compose.prod.yml pull
#    docker-compose -f docker-compose.prod.yml up -d --build
#
# Backup database:
#    docker-compose -f docker-compose.prod.yml exec db pg_dump -U ${DB_USER} ${DB_NAME} > backup.sql
#
# Restore database:
#    cat backup.sql | docker-compose -f docker-compose.prod.yml exec -T db psql -U ${DB_USER} ${DB_NAME}
