# Prometheus configuration for Gassigeher SaaS
# This file is mounted into the Prometheus container
#
# Note: basic_auth passwords are read from /etc/prometheus/secrets/metrics_password
# This file is generated by the install script from METRICS_PASSWORD env var

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'gassigeher'

# Alertmanager configuration (optional - add later for alerting)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Gassigeher application metrics
  - job_name: 'gassigeher'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8080']
        labels:
          app: 'gassigeher'
          env: 'production'
    # Basic auth credentials - read from secrets file
    basic_auth:
      username: 'prometheus'
      password_file: '/etc/prometheus/secrets/metrics_password'

  # PostgreSQL metrics via postgres_exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          db: 'gassigeher'

  # Node Exporter - Host system metrics
  # Runs natively on host (apt install prometheus-node-exporter)
  # Prometheus container uses extra_hosts to resolve host.docker.internal
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          instance: 'host'

  # Caddy metrics (reverse proxy)
  - job_name: 'caddy'
    static_configs:
      - targets: ['caddy:2019']
        labels:
          service: 'caddy'

  # MinIO metrics (S3 storage)
  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: 'minio'
